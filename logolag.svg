<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 10000 10000"
   width="10000"
   height="10000"
   version="1.1"
   id="svg4"
   sodipodi:docname="binary_void.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview4"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1">
    <inkscape:page
       x="0"
       y="0"
       width="10000"
       height="10000"
       id="page2"
       margin="0"
       bleed="0" />
  </sodipodi:namedview>
  <defs
     id="defs1">
    <mask
       id="void-mask">
      <rect
         width="100"
         height="100"
         fill="#ffffff"
         id="rect1"
         x="0"
         y="0" />
      <circle
         cx="50"
         cy="50"
         r="15"
         fill="#000000"
         id="circle1" />
    </mask>
  </defs>
  <!-- Exact background color from the image -->
  <rect
     width="100"
     height="100"
     fill="#09090b"
     id="rect2"
     inkscape:export-filename="rect2.png"
     inkscape:export-xdpi="96"
     inkscape:export-ydpi="96"
     x="0"
     y="0" />
  <g
     fill="none"
     id="g4">
    <!-- Masked Binary Rings -->
    <g
       mask="url(#void-mask)"
       id="g3">
      <!-- Left ring: Solid Pure White -->
      <circle
         cx="38"
         cy="50"
         r="22"
         stroke="#ffffff"
         stroke-width="3.5"
         id="circle2" />
      <!-- Right ring: Muted Gray (50% Opacity White) -->
      <circle
         cx="62"
         cy="50"
         r="22"
         stroke="#ffffff"
         stroke-width="3.5"
         opacity="0.5"
         id="circle3" />
    </g>
    <!-- Center Dot: Solid Pure White -->
    <circle
       cx="50"
       cy="50"
       r="4.5"
       fill="#ffffff"
       id="circle4" />
  </g>
</svg>
