    <rect x="626.6" y="410" width="572.8" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="913" y="426" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#92400E">5. evaluateUpdate(): Block Viewer file writes/deletes; verify chat userId</text>
  </g><line x1="1085" y1="472" x2="149" y2="472" stroke="#166534" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <g>
    <rect x="368.6" y="448" width="496.79999999999995" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="617" y="464" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#166534">6. Apply CRDT delta, trimChatHistory(200) &amp; Relay to Room Peers</text>
  </g><line x1="1085" y1="518" x2="1421" y2="518" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="974.2" y="494" width="557.6" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1253" y="510" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#334155">7. scheduleSave(): 2s idle debounce OR 10s max-wait throttle -&gt; MongoDB</text>
  </g><line x1="425" y1="612" x2="1421" y2="612" stroke="#92400E" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <g>
