    <text x="447" y="660" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#92400E">9. updateClientRoleInMemory() FIRST -&gt; Broadcast updated roster event</text>
  </g><line x1="425" y1="768" x2="1421" y2="768" stroke="#5B21B6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <g>
