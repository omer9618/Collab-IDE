    <text x="443" y="388" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#166534">4. Binary Yjs SyncStep2 / Update Frame (&lt;= 512KB, &lt;= 300 msg/s)</text>
  </g><line x1="745" y1="434" x2="1081" y2="434" stroke="#92400E" stroke-width="2" marker-end="url(#arrowAmber)"/>
