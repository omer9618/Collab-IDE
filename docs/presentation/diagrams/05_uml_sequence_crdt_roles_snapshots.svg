    <text x="447" y="848" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#5B21B6">12. session.destroy(true) -&gt; Close 1001 -&gt; Clients Re-hydrate Clean State</text>
  </g><g><rect x="36" y="908" width="20" height="16" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/><text x="64" y="921" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">WS Handshake &amp; Cluster Presence</text><rect x="318.70000000000005" y="908" width="20" height="16" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/><text x="346.70000000000005" y="921" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">CRDT Sync &amp; Max-Wait Persistence</text><rect x="609.1" y="908" width="20" height="16" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><text x="637.1" y="921" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">YjsUpdateGuard &amp; Atomic RBAC</text><rect x="868.7" y="908" width="20" height="16" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/><text x="896.7" y="921" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">Bounded Snapshots &amp; Clean Rollback</text></g>
