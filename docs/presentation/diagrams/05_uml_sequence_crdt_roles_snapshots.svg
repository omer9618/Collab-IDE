    <text x="923" y="604" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#92400E">8. PUT /api/rooms/:uuid/roles -&gt; Atomic Room.bulkWrite(bulkOps)</text>
  </g><line x1="745" y1="668" x2="149" y2="668" stroke="#92400E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <g>
