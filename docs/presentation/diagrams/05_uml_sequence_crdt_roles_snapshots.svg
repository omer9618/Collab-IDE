  <text x="36" y="44" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0F172A">UML Sequence Diagram — Real-Time Yjs CRDT Sync, Role Control &amp; Snapshots</text>
  <text x="36" y="69" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" fill="#475569">Server-authoritative write barriers (YjsUpdateGuard), atomic role swaps, max-wait persistence, and conflict-free snapshot restoration</text>
  <line x1="145" y1="158" x2="145" y2="894" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="52.5" y="104" width="185" height="54" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/><text x="145" y="127" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1E40AF">Editor / Viewer</text><text x="145" y="146" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="12.5" fill="#1E293B">Monaco + y-websocket</text><line x1="425" y1="158" x2="425" y2="894" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="330" y="104" width="190" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="425" y="127" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#5B21B6">Owner / Leader</text><text x="425" y="146" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="12.5" fill="#1E293B">WorkspaceView UI</text><line x1="745" y1="158" x2="745" y2="894" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="632.5" y="104" width="225" height="54" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="745" y="127" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#92400E">WS Relay &amp; Guard</text><text x="745" y="146" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="12.5" fill="#1E293B">yjsUpdateGuard + RoomMgr</text><line x1="1085" y1="158" x2="1085" y2="894" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="982.5" y="104" width="205" height="54" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="1085" y="127" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#166534">In-Memory Y.Doc</text><text x="1085" y="146" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="12.5" fill="#1E293B">Isolated RoomSession</text><line x1="1425" y1="158" x2="1425" y2="894" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="1317.5" y="104" width="215" height="54" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="1425" y="127" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#334155">MongoDB + Pub/Sub</text><text x="1425" y="146" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="12.5" fill="#1E293B">Room.ydocState &amp; Cluster</text><rect x="30" y="174" width="1540" height="158" rx="8" fill="#EFF6FF" fill-opacity="0.45" stroke="#3B82F6" stroke-width="1.6"/><rect x="30" y="174" width="728.6" height="26" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/><text x="42" y="192" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1E40AF">Phase A: Authenticated WebSocket Handshake &amp; Cluster Presence (NFR-17, NFR-36, SDR-01)</text><rect x="30" y="346" width="1540" height="202" rx="8" fill="#F0FDF4" fill-opacity="0.45" stroke="#16A34A" stroke-width="1.6"/><rect x="30" y="346" width="777.1999999999999" height="26" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/><text x="42" y="364" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#166534">Phase B: Real-Time CRDT Edit, YjsUpdateGuard &amp; Max-Wait Flush (FR-16, FR-34, NFR-08, NFR-18)</text><rect x="30" y="562" width="1540" height="144" rx="8" fill="#FFFBEB" fill-opacity="0.45" stroke="#D97706" stroke-width="1.6"/><rect x="30" y="562" width="647.6" height="26" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/><text x="42" y="580" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#92400E">Phase C: Live Role Grant / Revoke without Reconnect (FR-39 to FR-44, NFR-19)</text><rect x="30" y="720" width="1540" height="162" rx="8" fill="#F5F3FF" fill-opacity="0.45" stroke="#7C3AED" stroke-width="1.6"/><rect x="30" y="720" width="590.9" height="26" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/><text x="42" y="738" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#5B21B6">Phase D: Manual Snapshot (Ctrl+S) &amp; Clean CRDT Restore (FR-37, FR-38)</text><line x1="145" y1="224" x2="741" y2="224" stroke="#1E40AF" stroke-width="2" marker-end="url(#arrowBlue)"/>
