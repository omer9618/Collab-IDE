  </g><line x1="425" y1="812" x2="741" y2="812" stroke="#5B21B6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <g>
    <rect x="323.20000000000005" y="788" width="519.5999999999999" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="583" y="804" text-anchor="middle" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#5B21B6">11. POST /:uuid/snapshots/:id/restore -&gt; Overwrite ydocState in DB</text>
  </g><line x1="745" y1="856" x2="149" y2="856" stroke="#5B21B6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>
  <g>
