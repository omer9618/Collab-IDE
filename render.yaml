# ==============================================================================
# CollabIDE - Render Cloud Deployment Blueprint (NFR-49)
#
# SECURITY NOTICE:
# Historical commits prior to NFR-49 contained plaintext credentials.
# All production credentials (MongoDB password, RapidAPI key, TURN_SECRET,
# FIELD_ENCRYPTION_KEY) must be rotated at their source providers and entered
# manually in the Render Web Dashboard (Environment section).
# ==============================================================================

services:
  - type: web
    name: collabide-backend
    env: node
    rootDir: collab-ide
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_URL
        value: "https://judge0-ce.p.rapidapi.com"
      - key: EXECUTION_MOCK_MODE
        value: "false"
      - key: MOCK_EMAIL_VERIFICATION
        value: "false"
      - key: STUN_SERVER_URL
        value: "stun:stun.l.google.com:19302"
      - key: TURN_SERVER_URL
        value: "turn:openrelay.metered.ca:80"
