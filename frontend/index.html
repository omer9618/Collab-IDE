<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Best Practices -->
    <title>Collide — Real-Time Collaborative Workspace</title>
    <meta name="description" content="Collaborate, edit, and execute code in real-time with Monaco Editor, Yjs sync, and built-in peer voice chat channels." />

    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400..700;1,400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
      (function() {
        try {
          var t = localStorage.getItem('collabide_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (_e) {}
      })();
    </script>

    <!-- Tailwind CSS CDN with configuration (matching Stitch) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      try {
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                primary: "var(--accent-blue)",
                surface: "var(--bg-surface)",
                "surface-base": "var(--bg-base)",
                "surface-panel": "var(--bg-panel)",
                "surface-elevated": "var(--bg-elevated)",
                "surface-hover": "var(--bg-hover)",
                "surface-active": "var(--bg-active)",
                "on-surface": "var(--text-primary)",
                "on-surface-variant": "var(--text-secondary)",
                "on-surface-muted": "var(--text-muted)",
                outline: "var(--border-default)",
                "outline-subtle": "var(--border-subtle)",
                "accent-blue": "var(--accent-blue)",
                "accent-blue-dim": "var(--accent-blue-dim)",
                "accent-red": "var(--accent-red)",
                "accent-orange": "var(--accent-orange)",
                "accent-green": "var(--accent-green)",
                "text-primary": "var(--text-primary)",
                "text-secondary": "var(--text-secondary)",
                "text-muted": "var(--text-muted)",
                "bg-base": "var(--bg-base)",
                "bg-surface": "var(--bg-surface)",
                "bg-panel": "var(--bg-panel)",
                "bg-elevated": "var(--bg-elevated)",
                "border-default": "var(--border-default)",
                "border-subtle": "var(--border-subtle)"
              },
              borderRadius: {
                DEFAULT: "0.125rem",
                sm: "2px",
                md: "4px",
                lg: "8px",
                full: "9999px",
                "radius-md": "4px",
                "radius-lg": "8px",
                "radius-sm": "2px"
              },
              spacing: {
                "touch-target": "32px",
                "unit": "4px",
                "gutter": "12px",
                "activity-bar-width": "48px",
                "sidebar-width": "240px",
                "top-bar-height": "44px",
                "status-bar-height": "22px"
              },
              fontFamily: {
                ui: ["Inter", "sans-serif"],
                code: ["JetBrains Mono", "monospace"],
                serif: ["Lora", "Georgia", "serif"]
              },
              fontSize: {
                "text-xs": ["11px", "16px"],
                "text-sm": ["13px", "18px"],
                "text-base": ["14px", "20px"],
                "text-lg": ["16px", "24px"],
                "text-xl": ["20px", "28px"]
              }
            }
          }
        };
      } catch (_e) {}
    </script>
    <style>
      :root, html.dark {
        --bg-base: #0d0e0f;
        --bg-surface: #121414;
        --bg-panel: #1b1c1c;
        --bg-elevated: #1f2020;
        --bg-hover: #252626;
        --bg-active: #2b2d30;
        --border-subtle: #2b2b2b;
        --border-default: #404751;
        --border-strong: #8a919d;
        --text-primary: #e3e2e2;
        --text-secondary: #c0c7d3;
        --text-muted: #8a919d;
        --accent-blue: #007acc;
        --accent-blue-dim: #9fcaff;
        --accent-green: #1e8e3e;
        --accent-red: #d93025;
        --accent-orange: #b95e01;
        --scrollbar-thumb: #404751;
        --scrollbar-thumb-hover: #8a919d;
        --glass-bg: rgba(31, 32, 32, 0.75);
        color-scheme: dark;
        
        --peer-1: #1a73e8;
        --peer-2: #1e8e3e;
        --peer-3: #f9ab00;
        --peer-4: #a142f4;
        --peer-5: #e52592;
      }

      html.light {
        --bg-base: #f1f5f9;       /* Slate-100: soft neutral page background */
        --bg-surface: #ffffff;    /* Pure white surfaces (topbars, main canvas) */
        --bg-panel: #f8fafc;      /* Slate-50: sidebars, explorer, activity bar, terminal */
        --bg-elevated: #ffffff;   /* Pure white: dropdowns, modals, cards */
        --bg-hover: #e2e8f0;      /* Slate-200: clean subtle hover */
        --bg-active: #cbd5e1;     /* Slate-300: active press/selection */
        --border-subtle: #e2e8f0; /* Subtle light border */
        --border-default: #cbd5e1;/* Standard border */
        --border-strong: #94a3b8; /* Strong border */
        --text-primary: #0f172a;  /* Slate-900: crisp high contrast text */
        --text-secondary: #334155;/* Slate-700: secondary descriptive text */
        --text-muted: #64748b;    /* Slate-500: timestamps, placeholders, icons */
        --accent-blue: #0284c7;   /* Sky-600: vibrant IDE blue */
        --accent-blue-dim: #bae6fd;/* Sky-200: badge/highlight */
        --accent-green: #16a34a;
        --accent-red: #dc2626;
        --accent-orange: #ea580c;
        --scrollbar-thumb: #cbd5e1;
        --scrollbar-thumb-hover: #94a3b8;
        --glass-bg: rgba(255, 255, 255, 0.85);
        color-scheme: light;

        --peer-1: #0284c7;
        --peer-2: #16a34a;
        --peer-3: #d97706;
        --peer-4: #9333ea;
        --peer-5: #db2777;
      }

      body {
        background-color: var(--bg-base);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        font-family: 'Inter', sans-serif;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      /* Light mode comprehensive class overrides for seamless full UI theme */
      html.light .bg-\[\#121414\],
      html.light .bg-\[\#121314\],
      html.light .bg-\[\#0d0e0f\] {
        background-color: var(--bg-surface) !important;
      }
      html.light .bg-\[\#161718\]\/60 {
        background-color: var(--bg-hover) !important;
      }
      html.light .bg-\[\#1b1c1c\],
      html.light .bg-\[\#1a1b1b\],
      html.light .bg-\[\#1f2020\],
      html.light .bg-\[\#1f2021\],
      html.light .bg-\[\#202225\],
      html.light .bg-\[\#18191a\],
      html.light .bg-\[\#181a1b\],
      html.light .bg-\[\#181818\],
      html.light .bg-\[\#141618\],
      html.light .bg-\[\#1e2022\],

      html.light .hover\:bg-\[\#2a2d2e\]:hover {

      }
      html.light .bg-\[\#3c3c3c\] {
        background-color: var(--bg-active) !important;
      }
      html.light .border-\[\#2b2b2b\],
      html.light .border-\[\#303338\],
      html.light .border-\[\#333\] {

      /* Logo theme adapt: in light mode, display logo with black circle & 'ide' */

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;

        direction: ltr;
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      @keyframes pulse-ring {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.08); opacity: 0; }
      }
      .speaking-pulse {
        animation: pulse-ring 2s ease-in-out infinite;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
