# ==============================================================================
# CollabIDE - Virtual Host & Reverse Proxy Server Block (NFR-33)
# ==============================================================================

# Upstream Node.js application cluster (PM2 cluster or Docker service)
upstream nodejs_backend {
    # Default upstream target. In Docker Compose, this resolves to the backend service.
    # In a standalone VPS deployment, this routes to 127.0.0.1:3000.
    server 127.0.0.1:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80) - Enforces HTTP to HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # ACME Challenge location for Certbot Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443) - TLS Termination, Static Serving & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost _;

    # --------------------------------------------------------------------------
    # TLS Termination & Certificate Paths
    # Strict filename contract matching Certbot standard outputs (fullchain.pem / privkey.pem)
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern TLS protocol & cipher suite (NFR-33)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Security Headers
    # Dev-Safe HSTS: Sent only for production domains via $hsts_header map
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Static Frontend File Serving (Client bundle, assets)
    # --------------------------------------------------------------------------
    root /var/www/collabide/frontend/dist;
    index index.html;

    # Static Asset Caching (NFR-41)
    # Versioned assets (content-hashed by Vite build tool) are cached immutable for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML entry point: Always requires revalidation to deliver latest bundle updates
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        limit_req zone=req_limit_per_ip burst=40 nodelay;
    }

    # Single Page Application (SPA) routing fallback
    # Protected by HTTP rate-limiting (20 req/s with burst=40 for lab NAT resilience)
    location / {
        limit_req zone=req_limit_per_ip burst=40 nodelay;
        limit_conn conn_limit_per_ip 200;
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # REST API Reverse Proxy
    # --------------------------------------------------------------------------
    location /api/ {
        # Network-layer rate limiting protects Node.js backend from request floods
        limit_req zone=req_limit_per_ip burst=40 nodelay;
        limit_conn conn_limit_per_ip 200;

        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;

        # Standard Proxy Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy Connection Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Health Check Endpoint (NFR-39)
    # Unthrottled for automated uptime monitoring and process managers
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://nodejs_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # WebSocket Upgrade Proxying: Yjs CRDT Room Synchronization (/ws/)
    # RATE-LIMIT EXEMPT: Handshakes are NOT throttled by HTTP limit_req
    # ZERO BUFFERING & 24H TIMEOUTS: Prevents 60s silent disconnects
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://nodejs_backend/ws/;
        proxy_http_version 1.1;

        # RFC 6455 WebSocket Upgrade Handshake Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended Timeouts for Persistent Real-time Collaboration (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering to guarantee lowest keystroke latency
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # WebSocket Upgrade Proxying: Socket.IO Voice Signalling (/socket.io/)
    # RATE-LIMIT EXEMPT: Handshakes are NOT throttled by HTTP limit_req
    # ZERO BUFFERING & 24H TIMEOUTS: Prevents WebRTC voice call drops
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://nodejs_backend/socket.io/;
        proxy_http_version 1.1;

        # WebSocket Upgrade Handshake Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended Timeouts for Persistent Voice Signalling (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for instantaneous audio chunk exchange
        proxy_buffering off;
    }
}
