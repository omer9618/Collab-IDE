# ==============================================================================
# CollabIDE - Production Nginx Reverse Proxy Configuration (NFR-33)
# ==============================================================================

# user directive is omitted to use OS compiled-in default (www-data on Debian/Ubuntu, nginx on Alpine)

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # --------------------------------------------------------------------------
    # MIME Types and Encoding
    # --------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Performance & File Streaming Tuning
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --------------------------------------------------------------------------
    # Request Body Size (Prevents 413 Payload Too Large on code/file submissions)
    # --------------------------------------------------------------------------
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # --------------------------------------------------------------------------
    # Gzip Compression (NFR-42)
    # Compresses text-based responses above 1KB (HTML, CSS, JS, JSON, XML, SVG)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Connection Rate Limiting at Network Layer (NFR-34 & Lab NAT Resilient)
    # Defines shared memory zones for IP rate limiting and concurrency tracking.
    # Applied selectively to HTTP locations (/api/, /) to avoid throttling WebSockets.
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Return standard HTTP 429 Too Many Requests when limits are exceeded
    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # WebSocket Upgrade Header Mapping (RFC 6455)
    # Dynamically maps $http_upgrade to $connection_upgrade
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------------------------------
    # Dev-Safe HSTS Header Mapping
    # Suppresses HSTS on localhost/127.0.0.1 to avoid local browser cache poisoning
    # Enforces 1-year HSTS on production domains
    # --------------------------------------------------------------------------
    map $host $hsts_header {
        localhost "";
        127.0.0.1 "";
        default   "max-age=31536000; includeSubDomains; preload";
    }

    # --------------------------------------------------------------------------
    # Modular Site Configurations
    # --------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
